app = "resto-saveuramir"
primary_region = "cdg"

[build]

[env]
  PORT = "3000"
  DATABASE_URL = "file:/data/dev.db"
  # Les photos du menu vont sur le volume, avec la base : le reste du disque est
  # remplacé à chaque déploiement.
  PHOTOS_MENU_DIR = "/data/photos-menu"
  # Le découpage des journées et des mois comptables suit GMT, le fuseau de Dakar,
  # sans dépendre de la région où tourne la machine.
  TZ = "UTC"

[[mounts]]
  source = "resto_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
