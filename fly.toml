app = "resto-saveuramir"
primary_region = "cdg"

[build]

[env]
  PORT = "3000"
  DATABASE_URL = "file:/data/dev.db"

[[mounts]]
  source = "resto_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
